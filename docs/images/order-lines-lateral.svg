<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" width="760" height="384" role="img" aria-label="CROSS JOIN LATERAL turns each order into 1, 2 or 3 order lines" font-size="13">
<title>CROSS JOIN LATERAL turns each order into 1, 2 or 3 order lines</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ink { fill: #1f2328; } .quiet { fill: #59636e; }
  .edge { stroke: #8c959f; } .edgefill { fill: #8c959f; }
  .a { stroke: #0969da; } .afill { fill: #0969da; }
  .b { stroke: #bc4c00; } .bfill { fill: #bc4c00; }
  .live { stroke: #59636e; } .livefill { fill: #59636e; }
</style>
<rect x="0.5" y="0.5" width="759" height="383" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<defs><marker id="lat-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgefill"/></marker></defs>
<text x="24" y="28" class="ink" font-size="15" font-weight="600">CROSS JOIN LATERAL turns each order into 1, 2 or 3 order lines</text>
<text x="108" y="60" class="quiet" font-size="11.5" text-anchor="middle">one orders row</text>
<text x="332" y="60" class="quiet" font-size="11.5" text-anchor="middle">runs once for that row</text>
<text x="488" y="60" class="quiet" font-size="11.5">rows produced, one per order line</text>
<path d="M192 112H232" class="edge" fill="none" stroke-width="1.25" marker-end="url(#lat-arrow)"/>
<path d="M432 112H472" class="edge" fill="none" stroke-width="1.25" marker-end="url(#lat-arrow)"/>
<rect x="24" y="72" width="168" height="80" rx="8" class="edge" fill="none" stroke-width="1.25"/>
<text x="108" y="100" class="ink" text-anchor="middle" font-weight="600">Order 1</text>
<text x="108" y="120" class="quiet" font-size="11.5" text-anchor="middle">1 % 3 = 1</text>
<text x="108" y="136" class="quiet" font-size="11.5" text-anchor="middle">so 2 lines</text>
<rect x="232" y="72" width="200" height="80" rx="8" class="a afill" fill-opacity="0.12" stroke-width="2"/>
<text x="332" y="100" class="ink" text-anchor="middle" font-weight="600">generate_series(0, 1)</text>
<text x="332" y="120" class="ink" font-size="11.5" text-anchor="middle">returns 0 and 1</text>
<rect x="472" y="72" width="264" height="80" rx="8" class="edge" fill="none" stroke-width="1.25"/>
<text x="488" y="98" class="ink">line 0 → product 8, qty 2</text>
<text x="488" y="118" class="ink">line 1 → product 21, qty 3</text>
<path d="M192 216H232" class="edge" fill="none" stroke-width="1.25" marker-end="url(#lat-arrow)"/>
<path d="M432 216H472" class="edge" fill="none" stroke-width="1.25" marker-end="url(#lat-arrow)"/>
<rect x="24" y="176" width="168" height="80" rx="8" class="edge" fill="none" stroke-width="1.25"/>
<text x="108" y="204" class="ink" text-anchor="middle" font-weight="600">Order 2</text>
<text x="108" y="224" class="quiet" font-size="11.5" text-anchor="middle">2 % 3 = 2</text>
<text x="108" y="240" class="quiet" font-size="11.5" text-anchor="middle">so 3 lines</text>
<rect x="232" y="176" width="200" height="80" rx="8" class="a afill" fill-opacity="0.12" stroke-width="2"/>
<text x="332" y="204" class="ink" text-anchor="middle" font-weight="600">generate_series(0, 2)</text>
<text x="332" y="224" class="ink" font-size="11.5" text-anchor="middle">returns 0, 1 and 2</text>
<rect x="472" y="176" width="264" height="80" rx="8" class="edge" fill="none" stroke-width="1.25"/>
<text x="488" y="202" class="ink">line 0 → product 15, qty 3</text>
<text x="488" y="222" class="ink">line 1 → product 28, qty 4</text>
<text x="488" y="242" class="ink">line 2 → product 41, qty 1</text>
<path d="M192 320H232" class="edge" fill="none" stroke-width="1.25" marker-end="url(#lat-arrow)"/>
<path d="M432 320H472" class="edge" fill="none" stroke-width="1.25" marker-end="url(#lat-arrow)"/>
<rect x="24" y="280" width="168" height="80" rx="8" class="edge" fill="none" stroke-width="1.25"/>
<text x="108" y="308" class="ink" text-anchor="middle" font-weight="600">Order 3</text>
<text x="108" y="328" class="quiet" font-size="11.5" text-anchor="middle">3 % 3 = 0</text>
<text x="108" y="344" class="quiet" font-size="11.5" text-anchor="middle">so 1 line</text>
<rect x="232" y="280" width="200" height="80" rx="8" class="a afill" fill-opacity="0.12" stroke-width="2"/>
<text x="332" y="308" class="ink" text-anchor="middle" font-weight="600">generate_series(0, 0)</text>
<text x="332" y="328" class="ink" font-size="11.5" text-anchor="middle">returns 0</text>
<rect x="472" y="280" width="264" height="80" rx="8" class="edge" fill="none" stroke-width="1.25"/>
<text x="488" y="306" class="ink">line 0 → product 22, qty 4</text>
</svg>
