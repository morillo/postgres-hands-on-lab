<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" aria-label="Shared buffers cache 8 KB pages of table and index files; WAL buffers are written to WAL files on commit" font-size="13">
<title>Shared buffers cache 8 KB pages of table and index files; WAL buffers are written to WAL files on commit</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ink { fill: #1f2328; } .quiet { fill: #59636e; }
  .edge { stroke: #8c959f; } .edgefill { fill: #8c959f; }
  .a { stroke: #0969da; } .afill { fill: #0969da; }
  .b { stroke: #bc4c00; } .bfill { fill: #bc4c00; }
  .live { stroke: #59636e; } .livefill { fill: #59636e; }
</style>
<rect x="0.5" y="0.5" width="679" height="479" rx="12" fill="#ffffff" stroke="#d1d9e0"/>
<defs><marker id="mem-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="edgefill"/></marker></defs>
<rect x="40" y="30" width="600" height="130" rx="16" class="edge" fill="none" stroke-width="1.25"/>
<text x="60" y="54" class="ink" font-weight="600">Memory (server RAM)</text>
<rect x="60" y="70" width="340" height="70" rx="8" class="a afill" fill-opacity="0.12" stroke-width="1.5"/>
<text x="230" y="100" class="ink" text-anchor="middle" font-weight="600">Shared buffers</text>
<text x="230" y="120" class="quiet" font-size="11.5" text-anchor="middle">cache of 8 KB pages</text>
<rect x="420" y="70" width="200" height="70" rx="8" class="b bfill" fill-opacity="0.12" stroke-width="1.5"/>
<text x="520" y="100" class="ink" text-anchor="middle" font-weight="600">WAL buffers</text>
<text x="520" y="120" class="quiet" font-size="11.5" text-anchor="middle">newest log records</text>
<path d="M160 146V254" class="edge" fill="none" stroke-width="1.25" marker-start="url(#mem-arrow)" marker-end="url(#mem-arrow)"/>
<path d="M350 146V254" class="edge" fill="none" stroke-width="1.25" marker-start="url(#mem-arrow)" marker-end="url(#mem-arrow)"/>
<path d="M530 146V254" class="edge" fill="none" stroke-width="1.25" marker-end="url(#mem-arrow)"/>
<text x="170" y="204" class="quiet" font-size="11.5">pages in and out</text>
<text x="540" y="204" class="quiet" font-size="11.5">on commit</text>
<rect x="40" y="220" width="600" height="230" rx="16" class="edge" fill="none" stroke-width="1.25"/>
<text x="60" y="436" class="ink" font-weight="600">Disk (Docker volume pg1-data)</text>
<rect x="60" y="260" width="200" height="150" rx="8" class="a" fill="none" stroke-width="1.5"/>
<text x="160" y="286" class="ink" text-anchor="middle" font-weight="600">Table: orders</text>
<rect x="72" y="300" width="176" height="30" rx="4" class="a afill" fill-opacity="0.1" stroke-width="1"/>
<text x="160" y="319" class="ink" font-size="11.5" text-anchor="middle">main: the rows</text>
<rect x="72" y="335" width="176" height="30" rx="4" class="a afill" fill-opacity="0.1" stroke-width="1"/>
<text x="160" y="354" class="ink" font-size="11.5" text-anchor="middle">fsm: free space map</text>
<rect x="72" y="370" width="176" height="30" rx="4" class="a afill" fill-opacity="0.1" stroke-width="1"/>
<text x="160" y="389" class="ink" font-size="11.5" text-anchor="middle">vm: visibility map</text>
<rect x="280" y="260" width="140" height="56" rx="8" class="a" fill="none" stroke-width="1.5"/>
<text x="350" y="284" class="ink" text-anchor="middle" font-weight="600">orders_pkey</text>
<text x="350" y="302" class="quiet" font-size="11.5" text-anchor="middle">index file</text>
<rect x="440" y="260" width="180" height="56" rx="8" class="b" fill="none" stroke-width="1.5"/>
<text x="530" y="284" class="ink" text-anchor="middle" font-weight="600">pg_wal/</text>
<text x="530" y="302" class="quiet" font-size="11.5" text-anchor="middle">16 MB segment files</text>
</svg>
